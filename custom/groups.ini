; 这里放 custom/rules.ini 对应的策略组。
; 注意：custom_proxy_group 的名字必须和 ruleset= 后面的应用名一致。

; 示例：对应 custom/rules.ini 里的 Discord
; custom_proxy_group= Discord`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

; 示例：对应 MySite
; custom_proxy_group= MySite`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default

; 你的自定义策略组
; 两个 AI 组的健康检查直接请求 Claude / OpenAI，测的是整条住宅链。
; 本地覆写模块会把它们的成员替换为两条住宅链（不含任何普通节点）。
; 未安装或未启用覆写模块时只剩 REJECT：宁可连不上，也不走普通节点或直连。
custom_proxy_group=🤖 Claude 住宅链`fallback`[]REJECT`https://api.anthropic.com`180
custom_proxy_group=🤖 OpenAI 住宅链`fallback`[]REJECT`https://api.openai.com`180
; 优先经 Claude 住宅链出口；住宅链整体不通时回落普通新加坡节点。
custom_proxy_group=新加坡住宅优先`fallback`[]🤖 Claude 住宅链`[]🇸🇬 SG`https://cp.cloudflare.com/generate_204`180
; 覆盖上游同名组：Cloudflare 默认走新加坡（构建时会删掉上游的 ☁️ cloudflare 定义）。
custom_proxy_group=☁️ cloudflare`select`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
