; 这里放 custom/rules.ini 对应的策略组。
; 注意：custom_proxy_group 的名字必须和 ruleset= 后面的应用名一致。

; 示例：对应 custom/rules.ini 里的 Discord
; custom_proxy_group= Discord`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

; 示例：对应 MySite
; custom_proxy_group= MySite`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default

; 你的自定义策略组
; 优先经 🧠 AI 出口（启用覆写模块后它只含住宅链）；不通时回落普通新加坡节点。
custom_proxy_group=新加坡住宅优先`fallback`[]🧠 AI`[]🇸🇬 SG`https://cp.cloudflare.com/generate_204`180
; 覆盖上游同名组：Cloudflare 默认走新加坡（构建时会删掉上游的 ☁️ cloudflare 定义）。
custom_proxy_group=☁️ cloudflare`select`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
