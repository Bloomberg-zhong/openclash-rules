#!NAME = 新加坡住宅链式代理
#!DESC = Claude/OpenAI 只走住宅链，DNS、WebRTC 防泄露，放行 Tailscale
#!ENV = RESIDENTIAL_SERVER;RESIDENTIAL_PORT;RESIDENTIAL_USERNAME;RESIDENTIAL_PASSWORD

# OpenClash v0.47.081+ 覆写模块模板
#
# 住宅代理凭据不写在本文件里，而是填在 OpenClash 覆写模块的「环境变量」中，格式：
#   RESIDENTIAL_SERVER=1.2.3.4;RESIDENTIAL_PORT=6666;RESIDENTIAL_USERNAME=xxx;RESIDENTIAL_PASSWORD=xxx
# 添加模块时 #!ENV 会自动生成这四个键。模块从 GitHub 刷新也不会覆盖环境变量。
# 密码里不能含英文分号“;”，它是环境变量的分隔符。

[General]
CORE_TYPE = Meta

# 接管客户端 DNS；WAN/订阅默认 DNS 不得追加到业务查询链路。
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 0
ENABLE_RESPECT_RULES = 0
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0

# 住宅出口当前按 IPv4 使用，关闭 IPv6 与 AAAA 解析，避免旁路。
IPV6_ENABLE = 0
IPV6_DNS = 0

# TUN/Mix 接管 TCP 与 UDP；禁用 QUIC 让 HTTPS 优先回落到 TCP。
EN_MODE = fake-ip-mix
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ROUTER_SELF_PROXY = 1
PROXY_MODE = rule
RESTART = true

[YAML]
# DNS 防泄露：
# - 国外域名只经代理查询境外 DoH，国内 DNS 看不到国外域名；
# - Claude/OpenAI 域名单独通过各自的住宅链组查询；
# - 只有 cn / 私有域名、机场节点域名和直连流量使用国内 DoH；
# - DoH 一律写成 IP，不依赖明文 DNS 引导。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: false
  default-nameserver!:
    - '223.5.5.5'
    - '119.29.29.29'
  nameserver!:
    - 'https://1.1.1.1/dns-query#♻️ 自动选择'
    - 'https://8.8.8.8/dns-query#♻️ 自动选择'
  nameserver-policy!:
    'rule-set:claude':
      - 'https://1.1.1.1/dns-query#🤖 Claude 住宅链'
      - 'https://8.8.8.8/dns-query#🤖 Claude 住宅链'
    'geosite:anthropic':
      - 'https://1.1.1.1/dns-query#🤖 Claude 住宅链'
      - 'https://8.8.8.8/dns-query#🤖 Claude 住宅链'
    'rule-set:openai':
      - 'https://1.1.1.1/dns-query#🤖 OpenAI 住宅链'
      - 'https://8.8.8.8/dns-query#🤖 OpenAI 住宅链'
    'geosite:openai':
      - 'https://1.1.1.1/dns-query#🤖 OpenAI 住宅链'
      - 'https://8.8.8.8/dns-query#🤖 OpenAI 住宅链'
    'geosite:cn,private':
      - 'https://223.5.5.5/dns-query'
      - 'https://1.12.12.12/dns-query'
  proxy-server-nameserver!:
    - 'https://223.5.5.5/dns-query'
    - 'https://1.12.12.12/dns-query'
  direct-nameserver!:
    - 'https://223.5.5.5/dns-query'
    - 'https://1.12.12.12/dns-query'
  # Tailscale MagicDNS 名称不分配 fake-ip
  fake-ip-filter+:
    - '+.ts.net'

# 从 TLS/HTTP 握手识别真实域名：客户端绕过路由器 DNS 时，Claude/OpenAI 仍能命中住宅链规则。
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# 模块自带 Claude / OpenAI 规则集，不依赖订阅转换生成的 rule-provider 名称。
rule-providers:
  claude:
    type: http
    behavior: classical
    format: yaml
    url: 'https://raw.githubusercontent.com/Bloomberg-zhong/openclash-rules/main/rules/claude.yaml'
    path: './providers/claude.yaml'
    interval: 86400
  openai:
    type: http
    behavior: classical
    format: yaml
    url: 'https://raw.githubusercontent.com/Bloomberg-zhong/openclash-rules/main/rules/openai.yaml'
    path: './providers/openai.yaml'
    interval: 86400

# +rules 插入到全部规则最前面，顺序为：
# 1. Tailscale 放行（所有设备）：只放行它自己的 UDP 和 100.64.0.0/10，直连不走代理，不进住宅链。
#    41641 是 Tailscale 默认端口，WireGuard 隧道和 STUN 打洞都从它发出。
# 2. WebRTC 防泄露：受保护设备除 DNS(53)、NTP(123) 和上面的 Tailscale 外，UDP 一律拒绝，
#    任何端口的 STUN/TURN 都拿不到公网地址。设备 IP 变了要同步修改，并在 DHCP 设静态租约。
# 3. 拒绝 DoT(853)，客户端回落到路由器 DNS。
# 4. Claude / OpenAI 只走住宅链。前面三类规则只会 REJECT，或只放行 Tailscale 流量，
#    不可能把 Claude / OpenAI 送到普通节点或直连。
+rules:
  - 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve'
  - 'AND,((NETWORK,UDP),(SRC-PORT,41641)),DIRECT'
  - 'AND,((NETWORK,UDP),(DST-PORT,41641)),DIRECT'
  - 'AND,((NETWORK,UDP),(DOMAIN-SUFFIX,tailscale.com)),DIRECT'
  - 'AND,((NETWORK,UDP),(DOMAIN-SUFFIX,tailscale.io)),DIRECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.218/32),(NETWORK,UDP),(NOT,((OR,((DST-PORT,53),(DST-PORT,123)))))),REJECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.216/32),(NETWORK,UDP),(NOT,((OR,((DST-PORT,53),(DST-PORT,123)))))),REJECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.15/32),(NETWORK,UDP),(NOT,((OR,((DST-PORT,53),(DST-PORT,123)))))),REJECT'
  - 'DST-PORT,853,REJECT'
  - 'RULE-SET,claude,🤖 Claude 住宅链'
  - 'GEOSITE,anthropic,🤖 Claude 住宅链'
  - 'RULE-SET,openai,🤖 OpenAI 住宅链'
  - 'GEOSITE,openai,🤖 OpenAI 住宅链'

# 住宅 SOCKS5 先经模板里的 🇸🇬 SG（url-test，自动选可用的新加坡节点）再连出去。
proxies+:
  - name: '链式代理-新加坡住宅'
    type: socks5
    server: '${RESIDENTIAL_SERVER}'
    port: ${RESIDENTIAL_PORT}
    username: '${RESIDENTIAL_USERNAME}'
    password: '${RESIDENTIAL_PASSWORD}'
    udp: true
    dialer-proxy: '🇸🇬 SG'

# 模板生成的“🤖 Claude 住宅链”“🤖 OpenAI 住宅链”只含 REJECT（覆写未生效时宁可断网）；
# 覆写后成员只有住宅链，不通时也不会落到普通节点。
proxy-groups*:
  where:
    name: '/^🤖 (Claude|OpenAI) 住宅链$/'
  set:
    proxies:
      - '链式代理-新加坡住宅'
