# OpenClash v0.47.081+ 覆写模块模板
#
# 使用前必须在 OpenClash 本地把四个 __RESIDENTIAL_*__ 占位符替换为真实值。
# 两条住宅链各出现一次，共 8 处，请用“全部替换”。
# 不要把替换后的文件提交到 GitHub，避免泄露住宅代理凭据。

[General]
CORE_TYPE = Meta

# 接管客户端 DNS；WAN/订阅默认 DNS 不得追加到业务查询链路。
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 0
ENABLE_RESPECT_RULES = 0
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0

# 住宅出口当前按 IPv4 使用，关闭 IPv6 与 AAAA 解析，避免旁路。
IPV6_ENABLE = 0
IPV6_DNS = 0

# TUN/Mix 接管 TCP 与 UDP；禁用 QUIC 让 HTTPS 优先回落到 TCP。
# 只拒绝两台指定客户端的常见 WebRTC/STUN 端口，其他 UDP 继续按正常规则分流。
EN_MODE = fake-ip-mix
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ROUTER_SELF_PROXY = 1
PROXY_MODE = rule
RESTART = true

[YAML]
# 普通业务 DNS 直连国内 DoH；Claude/OpenAI 域名单独通过各自的住宅链组查询境外 DoH。
# proxy-server-nameserver 只负责解析机场/住宅代理自身的域名，避免 DNS 循环。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: false
  default-nameserver!:
    - '223.5.5.5'
    - '119.29.29.29'
  nameserver!:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'
  nameserver-policy!:
    'rule-set:claude':
      - 'https://1.1.1.1/dns-query#🤖 Claude 住宅链'
      - 'https://dns.google/dns-query#🤖 Claude 住宅链'
    'geosite:anthropic':
      - 'https://1.1.1.1/dns-query#🤖 Claude 住宅链'
      - 'https://dns.google/dns-query#🤖 Claude 住宅链'
    'geosite:openai':
      - 'https://1.1.1.1/dns-query#🤖 OpenAI 住宅链'
      - 'https://dns.google/dns-query#🤖 OpenAI 住宅链'
  proxy-server-nameserver!:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'

# 拒绝常见 TURN/STUN 和 Google WebRTC STUN 端口，防止真实 IP 经 UDP 旁路。
# 不再将整台设备的全部 UDP 送入住宅链，避免拖慢下载、P2P 和游戏流量。
+rules:
  - 'AND,((SRC-IP-CIDR,192.168.198.218/32),(NETWORK,udp),(DST-PORT,3478-3481)),REJECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.218/32),(NETWORK,udp),(DST-PORT,19302-19309)),REJECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.216/32),(NETWORK,udp),(DST-PORT,3478-3481)),REJECT'
  - 'AND,((SRC-IP-CIDR,192.168.198.216/32),(NETWORK,udp),(DST-PORT,19302-19309)),REJECT'

# 追加两条住宅链：出口是同一个住宅 SOCKS5，只是前置线路不同。
# 一条前置线路整体失效时，AI 组会自动切到另一条，出口 IP 保持不变。
proxies+:
  - name: '住宅链-经新加坡'
    type: socks5
    server: '__RESIDENTIAL_SERVER__'
    port: __RESIDENTIAL_PORT__
    username: '__RESIDENTIAL_USERNAME__'
    password: '__RESIDENTIAL_PASSWORD__'
    udp: true
    dialer-proxy: '前置-新加坡'
  - name: '住宅链-经亚洲备用'
    type: socks5
    server: '__RESIDENTIAL_SERVER__'
    port: __RESIDENTIAL_PORT__
    username: '__RESIDENTIAL_USERNAME__'
    password: '__RESIDENTIAL_PASSWORD__'
    udp: true
    dialer-proxy: '前置-亚洲备用'

# 前置组用 fallback：当前节点健康检查失败，或真实连接连续失败 2 次，就自动换下一个。
# include-all-providers 自动读取全部订阅，不写死 Provider_xxxxxx。
proxy-groups+:
  - name: '前置-新加坡'
    type: fallback
    include-all-providers: true
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 120
    timeout: 3000
    max-failed-times: 2
    lazy: false
  - name: '前置-亚洲备用'
    type: fallback
    include-all-providers: true
    filter: '(?i)(🇭🇰|香港|\bHK\b|hong\s*kong|🇯🇵|日本|\bJP\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei)'
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 120
    timeout: 3000
    max-failed-times: 2
    lazy: false

# 模板生成的“🤖 Claude 住宅链”“🤖 OpenAI 住宅链”只含普通新加坡节点作为启动回退；
# 覆写后成员只剩两条住宅链，健康检查地址（Claude / OpenAI）沿用模板设置。
# 两条都不通时也只会停在住宅链上，不会落到普通节点。
proxy-groups*:
  where:
    name: '/^🤖 (Claude|OpenAI) 住宅链$/'
  set:
    proxies:
      - '住宅链-经新加坡'
      - '住宅链-经亚洲备用'
    timeout: 5000
    max-failed-times: 2
    lazy: false
