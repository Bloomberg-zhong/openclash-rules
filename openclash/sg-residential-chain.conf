# OpenClash v0.47.081+ 覆写模块模板
#
# 使用前必须在 OpenClash 本地把四个 __RESIDENTIAL_*__ 占位符替换为真实值。
# 不要把替换后的文件提交到 GitHub，避免泄露住宅代理凭据。

[General]
CORE_TYPE = Meta

# 接管客户端 DNS；WAN/订阅默认 DNS 不得追加到业务查询链路。
ENABLE_REDIRECT_DNS = 1
ENABLE_CUSTOM_DNS = 0
ENABLE_RESPECT_RULES = 0
APPEND_DEFAULT_DNS = 0
APPEND_WAN_DNS = 0

# 住宅出口当前按 IPv4 使用，关闭 IPv6 与 AAAA 解析，避免旁路。
IPV6_ENABLE = 0
IPV6_DNS = 0

# TUN/Mix 接管 TCP 与 UDP；禁用 QUIC 让 HTTPS 优先回落到 TCP。
# 仅两台指定客户端的其他 UDP 使用住宅链，防止 WebRTC 等流量旁路。
EN_MODE = fake-ip-mix
ENABLE_UDP_PROXY = 1
DISABLE_UDP_QUIC = 1
ROUTER_SELF_PROXY = 1
PROXY_MODE = rule
RESTART = true

[YAML]
# 业务 DNS 通过住宅链连接境外 DoH。proxy-server-nameserver 只负责
# 解析机场/住宅代理自身的域名，用于打破“先有代理还是先有 DNS”的循环。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  default-nameserver!:
    - '223.5.5.5'
    - '119.29.29.29'
  nameserver!:
    - 'https://1.1.1.1/dns-query#住宅链式出口'
    - 'https://dns.google/dns-query#住宅链式出口'
  proxy-server-nameserver!:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'

# 不依赖具体 STUN 域名：只把两台指定客户端的全部 UDP 送入住宅链。
+rules:
  - 'AND,((SRC-IP-CIDR,192.168.198.218/32),(NETWORK,udp)),住宅链式出口'
  - 'AND,((SRC-IP-CIDR,192.168.198.216/32),(NETWORK,udp)),住宅链式出口'

# 追加住宅 SOCKS5 出口节点。
proxies+:
  - name: '链式代理-新加坡住宅'
    type: socks5
    server: '__RESIDENTIAL_SERVER__'
    port: '__RESIDENTIAL_PORT__'
    username: '__RESIDENTIAL_USERNAME__'
    password: '__RESIDENTIAL_PASSWORD__'
    udp: true
    dialer-proxy: '链式前置-新加坡'

# 自动包含最终配置中的全部 provider，并只筛选新加坡节点。
# 不再写死 Provider_xxxxxx 名称，机场更新 provider ID 后也不会导致启动失败。
proxy-groups+:
  - name: '链式前置-新加坡'
    type: select
    include-all-providers: true
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'

# 转换模板始终生成“住宅链式出口”组；覆写后将它唯一指向住宅节点。
proxy-groups*:
  where:
    name: '住宅链式出口'
  set:
    proxies:
      - '链式代理-新加坡住宅'
